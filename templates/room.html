<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unspooled - Room {{ code }}</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- html2pdf for client-side PDF downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Retro Typewriter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">

    <style>
        :root[data-theme="light"] {
            --bg-color: #f7f3e8;
            --page-bg: #fffdf9;
            --text-color: #2b2620;
            --text-muted: #726859;
            --border-color: #d8cebe;
            --accent: #9e3d24;
            --accent-hover: #7c2d18;
            --card-shadow: 4px 4px 0px #d8cebe;
            --input-bg: #fffdfa;
            --tape-color: rgba(220, 205, 175, 0.45);
            --paper-line: rgba(0, 0, 0, 0.04);
        }

        :root[data-theme="dark"] {
            --bg-color: #171513;
            --page-bg: #221f1c;
            --text-color: #eae3d2;
            --text-muted: #9e9382;
            --border-color: #3b3630;
            --accent: #d97757;
            --accent-hover: #e89578;
            --card-shadow: 4px 4px 0px #0b0a09;
            --input-bg: #1c1917;
            --tape-color: rgba(60, 54, 46, 0.5);
            --paper-line: rgba(255, 255, 255, 0.03);
        }

        body {
            font-family: 'Courier Prime', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 860px;
            margin: 30px auto;
            padding: 20px;
            line-height: 1.6;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        h2, h3, h4 {
            font-family: 'Special Elite', cursive, serif;
            letter-spacing: 0.03em;
        }

        h2.prompt-title {
            font-size: 1.8rem;
            margin: 4px 0;
            line-height: 1.2;
        }

        .timer-unit {
            text-align: right;
        }

        .timer {
            font-family: 'Special Elite', monospace;
            font-size: 2.8rem;
            line-height: 1;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        textarea {
            width: 100%;
            height: 440px;
            padding: 20px;
            font-size: 1.05rem;
            line-height: 1.8;
            background-color: var(--page-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            box-shadow: var(--card-shadow);
            box-sizing: border-box;
            resize: vertical;
            font-family: 'Courier Prime', Courier, monospace;
            background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
            background-size: 100% 1.8em;
        }

        textarea:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }

        textarea:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .theme-toggle-btn {
            background: var(--page-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-family: 'Courier Prime', monospace;
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 3px;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-color);
        }

        .btn-action {
            background: var(--accent);
            color: #ffffff;
            font-family: 'Special Elite', cursive, serif;
            font-size: 1.05rem;
            padding: 10px 22px;
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 2px;
            cursor: pointer;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .btn-action:hover {
            background: var(--accent-hover);
        }

        .btn-pdf {
            background: var(--text-color);
            color: var(--page-bg);
            font-family: 'Courier Prime', monospace;
            font-size: 0.8rem;
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            cursor: pointer;
            margin-top: 14px;
            display: inline-block;
        }

        .btn-pdf:hover {
            opacity: 0.85;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 24px;
        }

        .sheet-card {
            background: var(--page-bg);
            padding: 22px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            box-shadow: var(--card-shadow);
            position: relative;
        }

        .sheet-card h4 {
            margin-top: 0;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .header-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span style="font-size: 0.85rem; letter-spacing: 0.05em;">ROOM CODE: <strong>{{ code }}</strong> &bull; BYLINE: <strong>{{ user_name }}</strong></span>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">◐ Switch Theme</button>
    </div>

    <div class="header-content">
        <div>
            <span style="font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.08em;">Today's Prompt:</span>
            <h2 class="prompt-title">{{ topic }}</h2>
        </div>
        <div class="timer-unit">
            <div class="timer" id="timer-display">30:00</div>
        </div>
    </div>

    {% if is_admin %}
    <div id="admin-controls" style="margin-bottom: 20px;">
        <button id="start-btn" class="btn-action" onclick="startTimer()">⚡ Strike The Carriage (Start Timer)</button>
    </div>
    {% endif %}

    <div id="editor-section">
        <p id="status-msg" style="color: var(--text-muted); font-style: italic; margin-bottom: 8px;">Waiting for host to signal start...</p>
        <textarea id="editor" placeholder="Rest your fingers on the keys. Words will unlock when the clock strikes..." disabled></textarea>
    </div>

    <div id="reveal-section" class="hidden">
        <h3>📜 All Unspooled Drafts:</h3>
        <div id="submissions-grid" class="grid"></div>
    </div>

    <script>
        const socket = io();
        const code = "{{ code }}";
        const currentUserName = "{{ user_name }}";
        const currentTopic = "{{ topic }}";
        const isHost = {{ 'true' if is_admin else 'false' }};
        let countdownInterval;

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('unspooled-theme', theme);
            const btn = document.getElementById('themeBtn');
            if (btn) {
                btn.innerText = theme === 'dark' ? '☀ Parchment' : '☾ Carbon/Night';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'light' ? 'dark' : 'light';
            setTheme(next);
        }

        (function() {
            const saved = localStorage.getItem('unspooled-theme') || 'light';
            setTheme(saved);
        })();

        socket.emit('join', { code: code });

        function startTimer() {
            socket.emit('start_timer', { code: code });
        }

        setInterval(() => {
            const text = document.getElementById('editor').value;
            if (!document.getElementById('editor').disabled) {
                socket.emit('save_draft', { code: code, text: text });
            }
        }, 5000);

        socket.on('timer_started', (data) => {
            document.getElementById('editor').disabled = false;
            document.getElementById('editor').focus();
            document.getElementById('status-msg').innerText = "Keys active. Begin writing!";
            if (document.getElementById('admin-controls')) {
                document.getElementById('admin-controls').classList.add('hidden');
            }
            runCountdown(data.end_time);
        });

        socket.on('sync_state', (data) => {
            if (data.draft) {
                document.getElementById('editor').value = data.draft;
            }

            if (data.status === 'running') {
                document.getElementById('editor').disabled = false;
                document.getElementById('status-msg').innerText = "Keys active. Begin writing!";
                if (document.getElementById('admin-controls')) {
                    document.getElementById('admin-controls').classList.add('hidden');
                }
                runCountdown(data.end_time);
            } else if (data.status === 'finished') {
                showResults(data.submissions);
            }
        });

        socket.on('session_ended', (data) => {
            clearInterval(countdownInterval);
            showResults(data.submissions);
        });

        function runCountdown(endTime) {
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                const now = Date.now() / 1000;
                const remaining = Math.max(0, Math.floor(endTime - now));

                const mins = String(Math.floor(remaining / 60)).padStart(2, '0');
                const secs = String(remaining % 60).padStart(2, '0');
                document.getElementById('timer-display').innerText = `${mins}:${secs}`;

                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    const text = document.getElementById('editor').value;
                    socket.emit('save_draft', { code: code, text: text });
                    if (isHost) {
                        socket.emit('finish_session', { code: code });
                    }
                }
            }, 1000);
        }

        function showResults(submissions) {
            document.getElementById('editor-section').classList.add('hidden');
            document.getElementById('reveal-section').classList.remove('hidden');
            document.getElementById('timer-display').innerText = "00:00";

            const container = document.getElementById('submissions-grid');
            container.innerHTML = '';
            
            for (const [author, text] of Object.entries(submissions)) {
                const card = document.createElement('div');
                card.className = 'sheet-card';
                
                const isCurrentUser = (author === currentUserName);
                const safeAuthor = escapeHtml(author);
                const safeText = escapeHtml(text || '[Page left blank]');

                let cardHtml = `
                    <h4>
                        <span>⌨ ${safeAuthor}</span>
                        ${isCurrentUser ? '<small style="color:var(--text-muted); font-size:0.75rem;">(You)</small>' : ''}
                    </h4>
                    <p style="white-space: pre-wrap; font-family: 'Courier Prime', monospace; line-height: 1.7;">${safeText}</p>
                `;

                // If this is the current writer's text, add PDF export button
                if (isCurrentUser || isHost) {
                    cardHtml += `<button class="btn-pdf" onclick="downloadPDF('${safeAuthor}')">📥 Download Manuscript (PDF)</button>`;
                }

                card.innerHTML = cardHtml;
                container.appendChild(card);
            }
        }

        function downloadPDF(author) {
            const rawText = document.getElementById('editor').value || "No content.";
            const dateStr = new Date().toLocaleDateString();

            // Create a clean off-screen printable manuscript
            const element = document.createElement('div');
            element.style.padding = '40px';
            element.style.fontFamily = "'Courier Prime', Courier, monospace";
            element.style.color = '#111';
            element.style.backgroundColor = '#fff';
            element.style.lineHeight = '1.8';

            element.innerHTML = `
                <div style="border-bottom: 2px solid #333; padding-bottom: 12px; margin-bottom: 24px;">
                    <p style="font-size: 11px; text-transform: uppercase; margin: 0; color: #666; letter-spacing: 1px;">UNSPOOLED &bull; SESSION MANUSCRIPT</p>
                    <h1 style="font-size: 22px; margin: 6px 0;">${escapeHtml(currentTopic)}</h1>
                    <p style="font-size: 13px; margin: 0; color: #444;">Author: <strong>${escapeHtml(author)}</strong> &bull; Date: ${dateStr}</p>
                </div>
                <div style="white-space: pre-wrap; font-size: 14px; text-align: justify;">${escapeHtml(rawText)}</div>
                <div style="margin-top: 50px; border-top: 1px dotted #aaa; padding-top: 10px; font-size: 11px; color: #888; text-align: center;">
                    Generated by Unspooled &bull; Spontaneous Timed Writing
                </div>
            `;

            const opt = {
                margin:       15,
                filename:     `unspooled-${author.toLowerCase().replace(/[^a-z0-9]/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
