<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unspooled</title>
    <!-- Retro Typewriter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        :root[data-theme="light"] {
            --bg-color: #f7f3e8;
            --page-bg: #fffdf9;
            --text-color: #2b2620;
            --text-muted: #726859;
            --border-color: #d8cebe;
            --accent: #9e3d24;
            --accent-hover: #7c2d18;
            --card-shadow: 4px 4px 0px #d8cebe;
            --input-bg: #fffdfa;
            --tape-color: rgba(220, 205, 175, 0.45);
        }

        :root[data-theme="dark"] {
            --bg-color: #171513;
            --page-bg: #221f1c;
            --text-color: #eae3d2;
            --text-muted: #9e9382;
            --border-color: #3b3630;
            --accent: #d97757;
            --accent-hover: #e89578;
            --card-shadow: 4px 4px 0px #0b0a09;
            --input-bg: #1c1917;
            --tape-color: rgba(60, 54, 46, 0.5);
        }

        body {
            font-family: 'Courier Prime', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 680px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .theme-toggle-btn {
            background: var(--page-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-family: 'Courier Prime', monospace;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-color);
            transition: all 0.15s ease;
        }

        .theme-toggle-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px var(--border-color);
        }

        h1, h2, h3 {
            font-family: 'Special Elite', cursive, serif;
            letter-spacing: 0.04em;
        }

        h1 {
            font-size: 2.8rem;
            margin: 0;
            line-height: 1.1;
        }

        p.subtitle {
            font-style: italic;
            color: var(--text-muted);
            margin-top: 6px;
            margin-bottom: 30px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 12px;
        }

        .card {
            background: var(--page-bg);
            border: 1px solid var(--border-color);
            padding: 26px;
            border-radius: 2px;
            box-shadow: var(--card-shadow);
            margin-bottom: 28px;
            position: relative;
        }

        /* Subtle retro desk tape accent */
        .card::before {
            content: "";
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 18px;
            background: var(--tape-color);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 14px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            margin-bottom: 10px;
            box-sizing: border-box;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-family: 'Courier Prime', Courier, monospace;
            font-size: 1rem;
            border-radius: 2px;
        }

        input:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: var(--accent);
            color: #ffffff;
            border: 1px solid rgba(0,0,0,0.15);
            font-family: 'Special Elite', cursive, serif;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            border-radius: 2px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            transition: all 0.15s ease;
        }

        button.btn-primary:hover {
            background: var(--accent-hover);
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px rgba(0,0,0,0.25);
        }

        .error {
            color: var(--accent);
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .archive-item {
            border-bottom: 1px dotted var(--border-color);
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .archive-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <span>[ № EST. 2026 ]</span>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">◐ Switch Theme</button>
    </div>

    <h1>🧵 Unspooled</h1>
    <p class="subtitle">A 30-minute spontaneous typewriting circle.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <div class="card">
        <h2>Join Session</h2>
        <form method="POST">
            <input type="hidden" name="action" value="join">
            <label>Session Code</label>
            <input type="text" name="room_code" placeholder="e.g. AB12CD" maxlength="8" required autocomplete="off">
            
            <label>Writer Pseudonym</label>
            <input type="text" name="user_name" placeholder="Enter your byline" required>
            
            <button class="btn-primary" type="submit">Take A Seat</button>
        </form>
    </div>

    <div class="card">
        <h2>Host Desk</h2>
        <form method="POST">
            <input type="hidden" name="action" value="create">
            <label>Passcode</label>
            <input type="password" name="admin_key" placeholder="Enter host passcode" required>
            
            <label>Prompt / Topic</label>
            <input type="text" name="topic" placeholder="e.g. The forgotten draft in the margin..." required>
            
            <button class="btn-primary" type="submit" style="background: var(--text-color); color: var(--page-bg);">Open 30-Min Room</button>
        </form>
    </div>

    {% if past_rooms %}
    <div class="card">
        <h2>📚 The Archive</h2>
        {% for r in past_rooms %}
        <div class="archive-item">
            <div>
                <strong style="font-size: 1.05rem;">{{ r['topic'] }}</strong><br>
                <small style="color: var(--text-muted);">CODE: {{ r['room_code'] }} | {{ r['created_at'][:10] }}</small>
            </div>
            <form method="POST" style="margin:0;">
                <input type="hidden" name="action" value="join">
                <input type="hidden" name="room_code" value="{{ r['room_code'] }}">
                <input type="hidden" name="user_name" value="Reader">
                <button type="submit" class="theme-toggle-btn" style="padding: 5px 12px;">Inspect</button>
            </form>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <script>
        // Theme initialization & toggle handler
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('unspooled-theme', theme);
            const btn = document.getElementById('themeBtn');
            if (btn) {
                btn.innerText = theme === 'dark' ? '☀ Parchment Mode' : '☾ Carbon/Night Mode';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'light' ? 'dark' : 'light';
            setTheme(next);
        }

        // Apply saved theme immediately on load
        (function() {
            const saved = localStorage.getItem('unspooled-theme') || 'light';
            setTheme(saved);
        })();
    </script>
</body>
</html>
